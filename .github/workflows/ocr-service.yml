name: OCR Service CI

on:
  push:
    branches: [main]
    paths:
      - "ocr-service/**"
      - ".github/workflows/ocr-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "ocr-service/**"
      - ".github/workflows/ocr-service.yml"

defaults:
  run:
    working-directory: ocr-service

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run pytest
        run: uv run pytest -v
