name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "kidney-frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "kidney-frontend/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: kidney-frontend

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kidney-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with eslint
        run: npm run lint

      - name: Run vitest
        run: npm run test

      - name: Build
        run: npm run build
