server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side history routing -- any path that isn't
    # a real static file falls back to index.html so the app's own router
    # handles it, instead of nginx 404ing on a refresh at e.g. /patients/3.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
