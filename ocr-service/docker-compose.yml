services:
  ocr-service:
    build: .
    container_name: ocr-service
    ports:
      - "8001:8001"
    environment:
      - OCR_SERVICE_API_KEY=${OCR_SERVICE_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen3-vl:4b-nothink
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    # Part H fix: peak memory in this service lives in PIL decodes (a 12MP
    # phone photo is ~36MB resident as a decoded bitmap, plus base64 copies
    # and, for bead specificity, 8 tiles on top -- see the Part G bounded-
    # memory notes) -- bounding it here means a runaway OOMs this
    # container instead of the host. 1g leaves real headroom above the
    # worst legitimate peak (well under 512MB with the module-level
    # extraction semaphore now capping concurrency to 1 -- see
    # app/api/routes.py) while still catching a genuine leak.
    mem_limit: 1g
    # Dev-only --reload + the live-editing bind mount that makes it useful
    # live in docker-compose.override.yml instead -- see this file's
    # Dockerfile comment on CMD for why they can't live here.

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      # Confirmed 2026-08-02 via Ollama's own load logs: on the dev RTX 2060,
      # the scheduler's VRAM budget for this model was ~5.0 GiB, the model's
      # full-precision weights alone are 4.5 GiB, leaving only ~0.5 GiB for
      # KV cache + compute buffers — but an 8192-context KV cache needs
      # 1-1.5 GiB at full f16 precision. That shortfall is what was forcing
      # most of the model onto CPU (observed 17%/83% GPU/CPU split even with
      # VRAM otherwise completely free — confirmed not an external-VRAM-
      # contention problem by testing against a freshly cleared GPU).
      # Quantizing the KV cache shrinks that requirement well below what's
      # left after the weights, which should let far more (plausibly all)
      # of the model's layers stay on GPU. Flash attention is required for
      # OLLAMA_KV_CACHE_TYPE to actually take effect (without it Ollama
      # silently keeps the cache at f16 regardless of this setting).
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      # Phase 1 speed pass (2026-08-04): these were previously just an
      # observed default (confirmed via the ollama container's own startup
      # logs — see llm_extract.py's CONCURRENT_TILE_LIMIT comment), not an
      # explicit setting. Pinning them so behavior doesn't silently change
      # on an Ollama upgrade. NUM_PARALLEL=1/MAX_LOADED_MODELS=1 matches
      # this GPU's real serialized-at-one-request reality (raising either
      # on 6GB VRAM pushes the model back into CPU offload, per the same
      # KV-cache-budget mechanism documented above for OLLAMA_KV_CACHE_TYPE).
      # KEEP_ALIVE=-1 stops the model unloading between calls — each
      # extraction batch makes several back-to-back requests, and a reload
      # mid-batch costs real time (~88s observed cold-load on CPU, see
      # ocr-service/app/llm/client.py::REQUEST_TIMEOUT_SECONDS).
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      # Part H fix: unset, this defaults to 512 -- an overflow request
      # doesn't fail fast, it queues, and each queued tile burns its own
      # REQUEST_TIMEOUT_SECONDS (ocr-service's app/llm/client.py) *while
      # waiting*, producing cascading timeouts that look like model
      # failures rather than a queue backing up. With ocr-service's own
      # module-level extraction semaphore in place (app/api/routes.py),
      # Ollama should never see more than 1 request at a time -- this is
      # the backstop for if that semaphore is ever removed, sized to
      # roughly one page's worth of tiles (see tiling.py::DEFAULT_NUM_TILES)
      # rather than left at the 512 default, which would just delay the
      # same cascading-timeout failure instead of preventing it.
      - OLLAMA_MAX_QUEUE=8
    volumes:
      - ollama-models:/root/.ollama
      - ./docker/ollama-entrypoint.sh:/ollama-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/ollama-entrypoint.sh"]
    healthcheck:
      # Only reports healthy once the -nothink model variant actually
      # exists (see docker/ollama-entrypoint.sh) — ocr-service's
      # depends_on above waits on this rather than racing a real request
      # against a half-provisioned Ollama on first boot.
      #
      # interval/retries sized generously (up to ~1 hour) because the FIRST
      # run has to pull a 3.3GB model — confirmed 2026-08-01 that this can
      # take considerably longer through Docker Desktop's virtualized
      # network than a direct host-side `ollama pull` of the same model
      # does, and the original 10.5-minute budget here false-failed on a
      # real run even though the pull was progressing fine the whole time
      # (`docker compose logs` just doesn't render Ollama's progress
      # percentages without a TTY, which made it look stalled when it
      # wasn't). This only costs real wall-clock time once per machine —
      # the model persists in the ollama-models volume after that, so a
      # normal restart reports healthy within seconds.
      test: ["CMD-SHELL", "ollama list | grep -q qwen3-vl:4b-nothink"]
      interval: 15s
      timeout: 5s
      retries: 240
      start_period: 30s
    restart: unless-stopped
    # Dev machines with a GPU (e.g. the RTX 2060 used for Phase 1
    # validation) should add GPU passthrough via a local, gitignored
    # docker-compose.override.yml:
    #   services:
    #     ollama:
    #       deploy:
    #         resources:
    #           reservations:
    #             devices:
    #               - driver: nvidia
    #                 count: 1
    #                 capabilities: [gpu]
    # This base file intentionally has no such block — it's the CPU-only
    # default, which is also what Phase 5's prod VPS deployment needs
    # unchanged (see claude/ocr-to-local-llm-migration-plan.md).

volumes:
  ollama-models:
