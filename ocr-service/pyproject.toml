[project]
name = "ocr-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "httpx>=0.28.0",
    "pillow>=11.0.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
# Mirrors kidney-backend/pyproject.toml's dev extra for consistency across
# the monorepo. respx mocks httpx.AsyncClient so the unit tests never make
# a real network call to Ollama — only app/tests/integration/ does that,
# and those tests are excluded by default (see [tool.pytest.ini_options]).
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
# ADDED 2026-08-01: without this, `uv sync` treats ocr-service as a
# dependencies-only ("virtual") project and never installs it into the
# venv itself -- `app.*` imports then only resolve when something (like
# `uv run uvicorn app.main:app`) happens to put the project root on
# sys.path via its own invocation mechanism. `uv run pytest` does NOT do
# that (it runs the pytest console-script directly, not `python -m
# pytest`), so every test importing `app.llm.client` etc. failed with
# `ModuleNotFoundError: No module named 'app'` on a real run. Mirrors
# kidney-backend/pyproject.toml's identical block, which is why
# kidney-backend's own test suite never hit this.

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
markers = [
    "integration: hits a real Ollama server (needs docker compose up locally); excluded by default, run with `uv run pytest -m integration`",
]
# Default run (plain `uv run pytest`, and CI's ocr-service.yml) only runs
# the fast, network-mocked unit tests. Integration tests need a live
# Ollama with qwen3-vl:4b-nothink provisioned — run them explicitly with
# `uv run pytest -m integration -v` against your own docker compose stack.
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
